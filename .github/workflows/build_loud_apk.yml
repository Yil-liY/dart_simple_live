name: build-loud-apk

on:
  workflow_dispatch:          # 手动触发

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 1. 签出代码（完整仓库，含 rust 源码，zip 会缺这些，必须用 checkout）
      - uses: actions/checkout@v6

      # 2. 设置 JAVA 17
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            simple_live_app/android/*.gradle*
            simple_live_app/android/**/gradle-wrapper.properties

      # 3. 设置 Flutter（版本取自 pubspec.yaml）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true

      # 4. 生成签名配置：用 Android 自带的 debug.keystore 签名（不必配置 secrets）
      - name: Create key.properties (debug sign)
        run: |
          echo "storeFile=$HOME/.android/debug.keystore" > simple_live_app/android/key.properties
          echo "storePassword=android" >> simple_live_app/android/key.properties
          echo "keyPassword=android" >> simple_live_app/android/key.properties
          echo "keyAlias=androiddebugkey" >> simple_live_app/android/key.properties

      # 5. 还原依赖
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 6. 编译 APK（arm64 = 现代手机通用架构，最关键的一个）
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --target-platform android-arm64

      # 7. 上传产物（Actions 页面下载）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slive-loud-apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
